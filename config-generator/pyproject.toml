[project]
name = "config-generator"
version = "0.1.0"
description = "Renders dnsmasq's DNS and DHCP configuration from static hosts, management-API reservations and Kubernetes Services."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "jinja2>=3.1",
    "kubernetes~=35.0",
    "pyyaml>=6.0",
    "waitress>=3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
    "types-waitress>=3.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ERA",    # eradicate (commented-out code)
    "RUF100", # unused noqa directives
]

[tool.mypy]
strict = true
files = ["src", "tests", "main.py"]

# The kubernetes client ships no type information.
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "INFO"
