projects:
  config-generator:
    description: >-
      The config generator: renders dnsmasq's static config once (`generate`)
      and keeps its dynamic config current (`serve`), in one image.
    setup: cexec modern-app uv sync --locked --all-packages
    test: cexec modern-app uv run --locked pytest
    lint:
      - cexec modern-app uv run --locked ruff check .
      - cexec modern-app uv run --locked ruff format --check .
      - cexec modern-app uv run --locked mypy
  management-api:
    description: >-
      The management API: hands out DHCP reservations from a dedicated /24 and
      pushes every change to the config generators.
    setup: cexec modern-app uv sync --locked --all-packages
    test: cexec modern-app uv run --locked pytest
    lint:
      - cexec modern-app uv run --locked ruff check .
      - cexec modern-app uv run --locked ruff format --check .
      - cexec modern-app uv run --locked mypy
  dnsmasq:
    description: >-
      The dnsmasq image: alpine's dnsmasq with the generated-config paths baked
      in, and the script that reports every lease change to DHCPApp. Image
      only; the integration tier tests it.
  integration-tests:
    cwd: tests
    description: >-
      The integration tier: builds the three images from the working tree and
      runs what only they show, each stack a one-pod Job in `development`.
    setup: cexec modern-app uv sync --locked --all-packages
    test: ./run-dev.sh
    lint:
      - cexec modern-app uv run --locked ruff check .
      - cexec modern-app uv run --locked ruff format --check .
      - cexec modern-app uv run --locked mypy
  validation:
    cwd: validation
    description: >-
      The validation image, which the Jenkins build's Test stage runs as a Job:
      the two packages' unit tests and the integration tier, against the images
      the build pushed. Its test runs that Job in `development` against images
      built from the working tree.
    test: ./run-dev.sh
  architecture:
    cwd: docs/architecture
    description: >-
      The architecture producer `dnsmasq`: the two apps' hand-authored models,
      validated as one set so the management API's reference to the config
      generator's service resolves, as Jenkinsfile.architecture (AaC/Dnsmasq)
      validates them.
    test: cexec aac-tools arch-validate --quiet *.yaml
